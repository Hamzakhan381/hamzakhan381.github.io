    <script>
      // The boot intro (developer typing, then waving hi) plays on the first visit of a session, unless motion is reduced.
      try {
        var seen = sessionStorage.getItem('hk-visited') || matchMedia('(prefers-reduced-motion: reduce)').matches;
        document.documentElement.classList.add(seen ? 'no-boot' : 'boot');
      } catch (e) {
        document.documentElement.classList.add('boot');
      }
    </script>
    <style>
      /* Boot intro. Inline so it paints with the HTML, before any JavaScript or stylesheet arrives.
         Every moving part animates transform or opacity only, so it stays smooth while the app boots. */
      .no-boot #boot { display: none; }
      .boot body { overflow: hidden; }
      #boot {
        --b-bg: #050607; --b-ink: #f4f6f8; --b-muted: #8d949e; --b-accent: #38bdf8; --b-ok: #3fb950;
        --b-glow: rgba(56, 189, 248, 0.3); --b-halo: rgba(56, 189, 248, 0.09);
        --b-skin: #f2c7a0; --b-nose: #d89c74; --b-hair: #1d1a18; --b-hoodie: #3a4351; --b-cuff: #4b5563; --b-hood: #2a313b;
        --b-chair: #1c2027; --b-laptop: #c9ced6; --b-laptop-edge: #9aa2ad; --b-desk: #1f242b; --b-desk-front: #14181d;
        --b-mug: #f4f6f8; --b-glasses: #0f1114; --b-string: #e8edf3; --b-mouth: #74291f; --b-blush: #f59e9e;
        --b-bubble: #f4f6f8; --b-bubble-ink: #0b0d12; --b-mug-line: transparent;
        position: fixed; inset: 0; z-index: 100;
        display: grid; place-content: center; justify-items: center; gap: 14px;
        padding: 16px;
        background: radial-gradient(42% 36% at 50% 44%, var(--b-halo), transparent 70%), var(--b-bg);
        color: var(--b-ink);
        animation: boot-failsafe 0.4s 15s forwards;
      }
      /* If a view transition ever runs while the intro is up, keep the intro on top of its snapshots, live and unfaded. */
      #boot { view-transition-name: boot-intro; }
      ::view-transition-group(boot-intro) { z-index: 100; animation: none; }
      ::view-transition-old(boot-intro) { display: none; }
      ::view-transition-new(boot-intro) { animation: none; }
      .boot__stage { position: relative; width: min(420px, 84vw); aspect-ratio: 4 / 3; transform-origin: 50% 68%; animation: boot-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      .boot__layer, .boot__layer > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #boot svg { display: block; }
      .b-skin { fill: var(--b-skin); } .b-hair { fill: var(--b-hair); } .b-hoodie { fill: var(--b-hoodie); } .b-cuff { fill: var(--b-cuff); }
      .b-hood { fill: var(--b-hood); } .b-chair { fill: var(--b-chair); } .b-laptop { fill: var(--b-laptop); } .b-laptop-edge { fill: var(--b-laptop-edge); }
      .b-desk { fill: var(--b-desk); } .b-desk-front { fill: var(--b-desk-front); } .b-accent { fill: var(--b-accent); } .b-glasses-fill { fill: var(--b-glasses); }
      .b-mug { fill: var(--b-mug); } .b-coffee { fill: #5b3a29; } .b-pot { fill: #d9622b; } .b-pot-rim { fill: #b84d1d; }
      .b-leaf { fill: #34d399; } .b-leaf-dark { fill: #10b981; } .b-blush { fill: var(--b-blush); } .b-mouth { fill: var(--b-mouth); }
      .b-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .b-string { stroke: var(--b-string); stroke-width: 2.4; } .b-band { stroke: var(--b-glasses); stroke-width: 6; }
      .b-brow { stroke: var(--b-hair); stroke-width: 3.6; } .b-nose { stroke: var(--b-nose); stroke-width: 2.2; }
      .b-mouth-line { stroke: var(--b-mouth); stroke-width: 2.6; } .b-steam { stroke: var(--b-muted); stroke-width: 2.4; }
      .b-glare { stroke: #fff; stroke-width: 2; opacity: 0.55; } .b-code { stroke: var(--b-accent); stroke-width: 2.6; }
      .b-mug-handle { stroke: var(--b-mug-line); stroke-width: 6.5; }
      .b-mug-handle-in { stroke: var(--b-mug); stroke-width: 4; }
      .b-glasses { fill: rgba(186, 225, 255, 0.16); stroke: var(--b-glasses); stroke-width: 2.8; }
      .b-mug { stroke: var(--b-mug-line); stroke-width: 1.2; }
      /* Typing: both arms tap away behind the lid while the head nods along. */
      .boot__arm--wave { transform-origin: 32.5% 52.67%; animation: boot-type-l 0.17s ease-in-out infinite alternate; }
      .boot__arm--rest { transform-origin: 67.5% 52.67%; animation: boot-type-r 0.17s ease-in-out 0.085s infinite alternate; }
      .boot__head { transform-origin: 50% 46%; animation: boot-nod 1.3s ease-in-out infinite; }
      .boot__eyes { transform: translateY(3px); transition: transform 0.25s ease; }
      .boot__brows { transition: transform 0.25s ease; }
      .boot__mouth-open, .boot__blush { opacity: 0; transition: opacity 0.2s ease; }
      .boot__glow { position: absolute; left: 22%; top: 34%; width: 56%; height: 34%; background: radial-gradient(closest-side, var(--b-glow), transparent); animation: boot-flicker 1.4s ease-in-out infinite alternate; }
      .boot__steam { animation: boot-steam 2.2s ease-in-out infinite; }
      .boot__code { position: absolute; top: 55%; left: var(--x); font: 500 clamp(10px, 3vw, 13px)/1 'Geist Mono', ui-monospace, Menlo, Consolas, monospace; color: var(--b-accent); white-space: nowrap; opacity: 0; animation: boot-code 1.75s cubic-bezier(0.25, 0.7, 0.35, 1) var(--d) infinite; }
      /* Hi: he looks up, smiles, raises an arm and waves while the bubble pops. */
      .is-waving .boot__arm--wave { animation: boot-hi 1.05s cubic-bezier(0.3, 0.7, 0.3, 1) forwards; }
      .is-waving .boot__arm--rest { animation: none; transform: rotate(15deg); }
      .is-waving .boot__head { animation: boot-look 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
      .is-waving .boot__eyes { transform: translateY(-0.5px); }
      .is-waving .boot__brows { transform: translateY(-3px); }
      .is-waving .boot__mouth-open { opacity: 1; }
      .is-waving .boot__mouth-calm { opacity: 0; }
      .is-waving .boot__blush { opacity: 0.6; }
      .is-waving .boot__code { animation-play-state: paused; opacity: 0; transition: opacity 0.2s; }
      .boot__bubble {
        position: absolute; left: 60%; top: 0; display: grid; gap: 2px; width: max-content; max-width: 48%;
        padding: 10px 14px; border-radius: 16px 16px 16px 4px; background: var(--b-bubble); color: var(--b-bubble-ink);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28); font: 500 clamp(11px, 3vw, 13px)/1.35 Geist, ui-sans-serif, system-ui, sans-serif;
        opacity: 0; transform: scale(0.4) rotate(-10deg); transform-origin: 0 100%;
        transition: opacity 0.2s 0.28s, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.28s;
      }
      .boot__bubble b { font-size: 1.45em; font-weight: 700; letter-spacing: -0.02em; }
      .is-waving .boot__bubble { opacity: 1; transform: none; }
      .boot__term { margin: 0; min-width: 17em; font: 500 clamp(11px, 3.2vw, 13px)/1.75 'Geist Mono', ui-monospace, Menlo, Consolas, monospace; color: var(--b-muted); animation: boot-in 0.6s 0.1s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      .boot__term b { color: var(--b-accent); font-weight: 500; }
      /* Typed by shrinking a cover off the text (a transform), so it keeps typing while the bundle runs. */
      .boot__cmd { position: relative; display: inline-block; color: var(--b-ink); }
      .boot__cmd::after { content: ''; position: absolute; inset: 0 -0.15em; background: var(--b-bg); transform-origin: 100% 50%; animation: boot-typing 0.34s steps(11, end) 0.12s forwards; }
      .boot__pulse { display: inline-block; width: 0.55em; height: 0.55em; margin-right: 0.35em; border-radius: 50%; background: var(--b-accent); animation: boot-pulse 0.7s ease-in-out infinite alternate; }
      .boot__ready { display: none; color: var(--b-ok); }
      .is-waving .boot__wait { display: none; }
      .is-waving .boot__ready { display: inline; }
      /* Leaving: the view dives into his laptop while the veil fades onto the page. */
      #boot.is-leaving, #boot.is-skipping { pointer-events: none; animation: boot-out 0.5s cubic-bezier(0.4, 0, 0.6, 1) 0.1s forwards; }
      #boot.is-skipping { animation-duration: 0.25s; animation-delay: 0s; }
      .is-leaving .boot__stage { animation: boot-dive 0.6s cubic-bezier(0.55, 0, 0.75, 0.2) forwards; }
      .is-skipping .boot__stage { animation: boot-dive 0.25s ease-in forwards; }
      .is-leaving .boot__term, .is-skipping .boot__term { opacity: 0; transition: opacity 0.2s; }
      @keyframes boot-in { from { transform: translateY(14px) scale(0.96); } }
      @keyframes boot-type-l { from { transform: rotate(-13deg); } to { transform: rotate(-18deg); } }
      @keyframes boot-type-r { from { transform: rotate(13deg); } to { transform: rotate(18deg); } }
      @keyframes boot-nod { 50% { transform: translateY(1.6px) rotate(1.2deg); } }
      @keyframes boot-flicker { from { opacity: 0.55; } to { opacity: 1; } }
      @keyframes boot-steam { 0% { opacity: 0; transform: translateY(6px); } 45% { opacity: 0.7; } 100% { opacity: 0; transform: translateY(-12px); } }
      @keyframes boot-code { 0% { opacity: 0; transform: translate(0, 0) scale(0.7); } 22% { opacity: 0.9; } 75% { opacity: 0; } 100% { opacity: 0; transform: translate(var(--dx), -7.5em) scale(1); } }
      @keyframes boot-hi {
        0% { transform: rotate(-15deg); } 28% { transform: rotate(146deg); } 42% { transform: rotate(124deg); }
        56% { transform: rotate(150deg); } 70% { transform: rotate(126deg); } 84% { transform: rotate(146deg); } 100% { transform: rotate(138deg); }
      }
      @keyframes boot-look { to { transform: translateY(-5px) rotate(-5deg); } }
      @keyframes boot-typing { to { transform: scaleX(0); } }
      @keyframes boot-pulse { from { opacity: 0.25; } to { opacity: 1; } }
      @keyframes boot-out { to { opacity: 0; } }
      @keyframes boot-dive { to { opacity: 0; transform: scale(2.2); } }
      @keyframes boot-failsafe { to { opacity: 0; visibility: hidden; } }
      @media (max-width: 600px) { @keyframes boot-dive { to { opacity: 0; transform: scale(1.5); } } }
      @media (prefers-reduced-motion: reduce) { #boot { display: none; } }
    </style>
